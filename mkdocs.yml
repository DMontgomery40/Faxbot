    - Delivery routes: operations/delivery-routes.md
    - Receiving faxes: operations/receiving.md
    - Intake: operations/intake.md
    - Work: operations/work.md
    - Email and folders: operations/connectors.md
    - Direct delivery: operations/direct-delivery.md
    - Tools:
      - Terminal: terminal.md
      - Scripts & Tests: tools/scripts-and-tests.md
      - Node MCP Scripts: tools/node-mcp-scripts.md
      - API Tests: tools/api-tests.md
      - Phaxio E2E Test: tools/phaxio-e2e-test.md
