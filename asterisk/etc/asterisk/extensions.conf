[general]
static=yes
writeprotect=no
autofallthrough=yes

[globals]

; Main fax out context. Originate with variables DEST, FAXFILE, JOBID, FAXATTEMPT
[faxout]
exten => s,1,NoOp(Fax outbound to ${DEST} file ${FAXFILE} job ${JOBID})
 same => n,Set(CHANNEL(hangup_handler_push)=fax-hangup,s,1(${JOBID}))
 same => n,Set(LOCALHEADERINFO=${ENV(FAX_HEADER)})
 same => n,Set(LOCALSTATIONID=${ENV(FAX_LOCAL_STATION_ID)})
 same => n,NoOp(Dialing PJSIP/${DEST}@trunk-endpoint)
 same => n,Dial(PJSIP/${DEST}@trunk-endpoint,60,U(faxsend^${FAXFILE}^${JOBID}^${FAXATTEMPT}))
 same => n,Hangup()

; Runs on answer in caller leg
[faxsend]
exten => s,1,NoOp(Begin SendFAX for job ${ARG2} using ${ARG1})
 same => n,Set(FAXOPT(headerinfo)=${LOCALHEADERINFO})
 same => n,Set(FAXOPT(localstationid)=${LOCALSTATIONID})
 same => n,Set(FAXOPT(ecm)=yes)
same => n,SendFAX(${ARG1},d)
 same => n,NoOp(SendFAX done status ${FAXSTATUS} error ${FAXERROR} pages ${FAXPAGES})
 same => n,UserEvent(FaxResult,JobID:${ARG2},Status:${FAXSTATUS},Error:${FAXERROR},Pages:${FAXPAGES},AttemptID:${ARG3})
 same => n,Return()

; Ensure we log something on hangup as well
[fax-hangup]
exten => s,1,NoOp(Hangup for job ${ARG1} cause ${HANGUPCAUSE})
 same => n,Return()

; Faxbot originates PJSIP directly; this post-answer context must never Dial.
; FAXHEADER64/FAXSTATION64 contain captured UTF-8 metadata. BASE64_DECODE is
; provided by func_base64 (autoloaded by modules.conf), never process ENV.
[faxbot-send]
exten => s,1,Set(CHANNEL(hangup_handler_push)=faxbot-result,s,1(${JOBID},${FAXATTEMPT}))
 same => n,Set(FAXSTATUS=FAILED)
 same => n,Set(FAXERROR=CHANNEL_HANGUP)
 same => n,Set(FAXPAGES=0)
 same => n,GotoIf($["${BASE64_DECODE(ZmF4Ym90)}" != "faxbot"]?codec-unavailable)
 same => n,GotoIf($["${FAXHEADER64}" = ""]?header-empty)
 same => n,Set(FAXOPT(headerinfo)=${BASE64_DECODE(${FAXHEADER64})})
 same => n,Goto(header-done)
 same => n(header-empty),Set(FAXOPT(headerinfo)=)
 same => n(header-done),GotoIf($["${FAXSTATION64}" = ""]?station-empty)
 same => n,Set(FAXOPT(localstationid)=${BASE64_DECODE(${FAXSTATION64})})
 same => n,Goto(station-done)
 same => n(station-empty),Set(FAXOPT(localstationid)=)
 same => n(station-done),Set(FAXOPT(ecm)=yes)
 same => n,SendFAX(${FAXFILE})
 same => n,Hangup()
 same => n(codec-unavailable),Set(FAXERROR=HEADER_CODEC_UNAVAILABLE)
 same => n,Hangup()

; One terminal observation, including interrupted SendFAX; no duplicate inline
; event after SendFAX. OriginateResponse handles calls that never answer.
[faxbot-result]
exten => s,1,GotoIf($["${FAXRESULT_EMITTED}" = "1"]?done)
 same => n,Set(FAXRESULT_EMITTED=1)
 same => n,Set(FAXSTATUS=${IF($["${FAXSTATUS}" = ""]?FAILED:${FAXSTATUS})})
 same => n,GotoIf($["${FAXSTATUS}" = "SUCCESS"]?pages)
 same => n,Set(FAXERROR=${IF($["${FAXERROR}" = ""]?CHANNEL_HANGUP:${FAXERROR})})
 same => n(pages),Set(FAXPAGES=${IF($["${FAXPAGES}" = ""]?0:${FAXPAGES})})
 same => n,UserEvent(FaxResult,JobID:${ARG1},AttemptID:${ARG2},Status:${FAXSTATUS},Error:${FAXERROR},Pages:${FAXPAGES})
 same => n(done),Return()
