[general]
static=yes
writeprotect=no
autofallthrough=yes

[globals]

; Main fax out context. Originate with variables DEST, FAXFILE, JOBID, FAXATTEMPT
[faxout]
exten => s,1,NoOp(Fax outbound to ${DEST} file ${FAXFILE} job ${JOBID})
 same => n,Set(CHANNEL(hangup_handler_push)=fax-hangup,s,1(${JOBID}))
 same => n,Set(LOCALHEADERINFO=${ENV(FAX_HEADER)})
 same => n,Set(LOCALSTATIONID=${ENV(FAX_LOCAL_STATION_ID)})
 same => n,NoOp(Dialing PJSIP/${DEST}@trunk-endpoint)
 same => n,Dial(PJSIP/${DEST}@trunk-endpoint,60,U(faxsend^${FAXFILE}^${JOBID}^${FAXATTEMPT}))
 same => n,Hangup()

; Runs on answer in caller leg
[faxsend]
exten => s,1,NoOp(Begin SendFAX for job ${ARG2} using ${ARG1})
 same => n,Set(FAXOPT(headerinfo)=${LOCALHEADERINFO})
 same => n,Set(FAXOPT(localstationid)=${LOCALSTATIONID})
 same => n,Set(FAXOPT(ecm)=yes)
same => n,SendFAX(${ARG1},d)
 same => n,NoOp(SendFAX done status ${FAXSTATUS} error ${FAXERROR} pages ${FAXPAGES})
 same => n,UserEvent(FaxResult,JobID:${ARG2},Status:${FAXSTATUS},Error:${FAXERROR},Pages:${FAXPAGES},AttemptID:${ARG3})
 same => n,Return()

; Ensure we log something on hangup as well
[fax-hangup]
exten => s,1,NoOp(Hangup for job ${ARG1} cause ${HANGUPCAUSE})
 same => n,Return()

; Faxbot originates PJSIP directly; this post-answer context must never Dial.
; SendFAX option z: if the far side has not switched the call to T.38 within
; about ten seconds (three CNG tones), Faxbot asks for the switch itself.
; FAXHEADER64/FAXSTATION64 contain captured UTF-8 metadata. BASE64_DECODE is
; provided by func_base64 (autoloaded by modules.conf), never process ENV.
; Speed and error correction come with the call (FAXBOT_MAXRATE, FAXBOT_ECM:
; Faxbot's fax settings and the recipient's own limits); without them, 9600 bit/s
; on audio calls (it survives a voice path better), else 14400, ECM on.
; FAXBOT_AUDIO=yes: audio fax for this call only, because fax over IP (T.38) to
; this number failed recently and audio fax has not (engine_learning.py). SendFAX
; option F keeps the call on audio and refuses the far end's T.38 request.
[faxbot-send]
exten => s,1,Set(CHANNEL(hangup_handler_push)=faxbot-result,s,1(${JOBID},${FAXATTEMPT}))
 same => n,Set(FAXBOT_ANSWERED=${EPOCH})
 same => n,Set(FAXBOT_CALLID=${CHANNEL(pjsip,call-id)})
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_CALLID64,FAXBOT_CALLID))
 same => n,Set(FAXSTATUS=FAILED)
 same => n,Set(FAXERROR=CHANNEL_HANGUP)
 same => n,Set(FAXPAGES=0)
 same => n,GotoIf($["${BASE64_DECODE(ZmF4Ym90)}" != "faxbot"]?codec-unavailable)
 same => n,GotoIf($["${FAXHEADER64}" = ""]?header-empty)
 same => n,Set(FAXOPT(headerinfo)=${BASE64_DECODE(${FAXHEADER64})})
 same => n,Goto(header-done)
 same => n(header-empty),Set(FAXOPT(headerinfo)=)
 same => n(header-done),GotoIf($["${FAXSTATION64}" = ""]?station-empty)
 same => n,Set(FAXOPT(localstationid)=${BASE64_DECODE(${FAXSTATION64})})
 same => n,Goto(station-done)
 same => n(station-empty),Set(FAXOPT(localstationid)=)
 same => n(station-done),Set(FAXOPT(ecm)=${IF($["${FAXBOT_ECM}" = "no"]?no:yes)})
 same => n,GotoIf($["${FAXBOT_MAXRATE}" != ""]?rate)
 same => n,Set(FAXBOT_MAXRATE=${IF($["${PJSIP_ENDPOINT(${CHANNEL(endpoint)},t38_udptl)}" = "false" | "${FAXBOT_AUDIO}" = "yes"]?9600:14400)})
 same => n(rate),Set(FAXOPT(maxrate)=${FAXBOT_MAXRATE})
; FAXBOT_DTMF: keys a phone menu needs before the fax machine answers (routing/after_answer.py), pressed on the
; voice call before SendFAX starts any fax tone.
 same => n,GotoIf($["${FAXBOT_DTMF}" = ""]?keys-done)
 same => n,SendDTMF(${FAXBOT_DTMF})
 same => n(keys-done),GotoIf($["${FAXBOT_AUDIO}" = "yes"]?audio)
; f: when the carrier refuses T.38, the fax goes on as audio on the same call.
 same => n,SendFAX(${FAXFILE},fz)
 same => n,Hangup()
 same => n(audio),SendFAX(${FAXFILE},F)
 same => n,Hangup()
 same => n(codec-unavailable),Set(FAXERROR=HEADER_CODEC_UNAVAILABLE)
 same => n,Hangup()

; One terminal observation, including interrupted SendFAX; no duplicate inline
; event after SendFAX. OriginateResponse handles calls that never answer.
; Mode is T38 or audio as reported by res_fax; the remote station identifier and
; the fax engine's error text are base64 encoded so commas stay literal.
; CallID64 is the call's SIP Call-ID, base64 encoded: the carrier bills the call under
; it, so Faxbot can match the carrier's charge to this call exactly.
; RtpTx and RtpRx count the audio packets sent to and received from the carrier,
; read only for a call that ended in audio (after a T.38 switch the counts are
; gone and Asterisk reports zero). Status64 is the fax engine's own reason.
; Rate and Resolution are res_fax's FAXBITRATE and FAXRESOLUTION: the speed and
; resolution of the last page only (measurement; Faxbot keeps them only when a
; page was confirmed, since before that they are spandsp's starting values).
; CsiCheck and T0Capped come from patch 0007: whether the station that answered
; matched, differed or was refused before any page (FAXBOT_CSI_EXPECT), and 1
; when no fax answered within FAXBOT_T0_MS of answer and Faxbot ended the call.
[faxbot-result]
exten => s,1,GotoIf($["${FAXRESULT_EMITTED}" = "1"]?done)
 same => n,Set(FAXRESULT_EMITTED=1)
 same => n,Set(FAXSTATUS=${IF($["${FAXSTATUS}" = ""]?FAILED:${FAXSTATUS})})
 same => n,GotoIf($["${FAXSTATUS}" = "SUCCESS"]?pages)
 same => n,Set(FAXERROR=${IF($["${FAXERROR}" = ""]?CHANNEL_HANGUP:${FAXERROR})})
 same => n(pages),Set(FAXPAGES=${IF($["${FAXPAGES}" = ""]?0:${FAXPAGES})})
 same => n,Set(FAXBOT_RTPTX=)
 same => n,Set(FAXBOT_RTPRX=)
 same => n,GotoIf($["${FAXMODE}" = "T38"]?emit)
 same => n,Set(FAXBOT_RTPTX=${CHANNEL(rtcp,txcount)})
 same => n,Set(FAXBOT_RTPRX=${CHANNEL(rtcp,rxcount)})
 same => n(emit),Gosub(faxbot-b64,s,1(FAXBOT_STATION64,REMOTESTATIONID))
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_ERROR64,FAXERROR))
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_STATUS64,FAXSTATUSSTRING))
 same => n,UserEvent(FaxResult,JobID:${ARG1},AttemptID:${ARG2},Status:${FAXSTATUS},Error:${FAXERROR},Pages:${FAXPAGES},Mode:${FAXMODE},Station64:${FAXBOT_STATION64},Answered:${FAXBOT_ANSWERED},Ended:${EPOCH},Cause:${HANGUPCAUSE},Error64:${FAXBOT_ERROR64},Status64:${FAXBOT_STATUS64},RtpTx:${FAXBOT_RTPTX},RtpRx:${FAXBOT_RTPRX},CallID64:${FAXBOT_CALLID64},Rate:${FILTER(0123456789,${FAXBITRATE})},Resolution:${FILTER(0123456789x,${FAXRESOLUTION})},CsiCheck:${FILTER(abcdefghijklmnopqrstuvwxyz,${FAXBOT_CSI_CHECK})},T0Capped:${FILTER(1,${FAXBOT_T0_CAPPED})})
 same => n,Gosub(faxbot-frames,s,1(out,${ARG1},${ARG2}))
 same => n(done),Return()

; Calls Faxbot's SSL Fax engine (HylaFAX+) places on its IAX lines. The number
; the engine dials is a one-time call tag. Faxbot stored the call plan under
; that tag over the manager connection (number in the carrier's format, caller
; ID, fax, attempt, fax preference header, T.38 for this call); DB_DELETE reads
; and removes it in one step, so the engine can only place calls Faxbot asked
; for, each once. A call over a trunk other than the first has a seventh
; field, that trunk's endpoint; only an endpoint named trunk-...-endpoint that
; Asterisk has loaded is dialed, anything else is refused.
; With T.38 for this call, the fax gateway (on this, the engine's channel) joins
; the engine's audio to T.38 on the trunk; the trunk channel asks the carrier
; for T.38 when it hears the far machine's fax tones (negotiate_both), and a
; refusal leaves the same call audio. Without it the call stays audio.
; (The gateway must not sit on the trunk channel: its own T.38 request would
; pass back through it and silence the line after a refusal.)
[faxbot-engine-out]
exten => _X.,1,Set(FAXBOT_TAG=${FILTER(0123456789,${EXTEN})})
 same => n,GotoIf($[${LEN(${FAXBOT_TAG})} != 16]?refuse)
 same => n,Set(FAXBOT_PLAN=${DB_DELETE(faxbot-engine/${FAXBOT_TAG})})
 same => n,GotoIf($["${FAXBOT_PLAN}" = ""]?refuse)
 same => n,Set(FAXBOT_DIAL=${FILTER(0123456789+*,${CUT(FAXBOT_PLAN,/,1)})})
 same => n,Set(CALLERID(all)=<${FILTER(0123456789+,${CUT(FAXBOT_PLAN,/,2)})}>)
 same => n,Set(JOBID=${FILTER(0123456789abcdef,${CUT(FAXBOT_PLAN,/,3)})})
 same => n,Set(FAXATTEMPT=${FILTER(0123456789abcdef,${CUT(FAXBOT_PLAN,/,4)})})
 same => n,Set(__FAXBOT_ENGINE_JOB=${JOBID})
 same => n,Set(__FAXBOT_ENGINE_ATTEMPT=${FAXATTEMPT})
 same => n,Set(__FAXBOT_PREFERENCE=${FILTER(01,${CUT(FAXBOT_PLAN,/,5)})})
 same => n,Set(FAXBOT_TRY_T38=${FILTER(01,${CUT(FAXBOT_PLAN,/,6)})})
 same => n,Set(FAXBOT_ENDPOINT=${CUT(FAXBOT_PLAN,/,7)})
 same => n,Set(FAXBOT_ENDPOINT=${IF($["${FAXBOT_ENDPOINT}" = ""]?trunk-endpoint:${FAXBOT_ENDPOINT})})
; Eighth field: keys to press once the number answers, before the engine's fax starts (Dial option D).
 same => n,Set(FAXBOT_DTMF=${FILTER(0123456789*#wW,${CUT(FAXBOT_PLAN,/,8)})})
; FILTER would read a - as a range, so the name is checked whole: trunk-endpoint or trunk-<key>-endpoint.
 same => n,GotoIf($[${REGEX("^trunk-([a-z0-9_-]+-)?endpoint$" ${FAXBOT_ENDPOINT})} = 0]?refuse)
 same => n,GotoIf($["${PJSIP_ENDPOINT(${FAXBOT_ENDPOINT},context)}" = ""]?refuse)
 same => n,Set(FAXBOT_STARTED=${EPOCH})
 same => n,Set(__FAXBOT_ENGINE_CHANNEL=${CHANNEL(name)})
 same => n,Set(CHANNEL(hangup_handler_push)=faxbot-engine-result,s,1)
 same => n,Set(__FAXBOT_GATEWAY=no)
 same => n,GotoIf($["${PJSIP_ENDPOINT(${FAXBOT_ENDPOINT},t38_udptl)}" = "false" | "${FAXBOT_TRY_T38}" = "0"]?dial)
 same => n,Set(FAXOPT(gateway)=yes)
 same => n,Set(__FAXBOT_GATEWAY=yes)
 same => n(dial),Dial(PJSIP/${FAXBOT_DIAL}@${FAXBOT_ENDPOINT},60,b(faxbot-engine-dial^s^1)U(faxbot-engine-answered)${IF($["${FAXBOT_DTMF}" != ""]?D(${FAXBOT_DTMF}))})
 same => n,Hangup()
 same => n(refuse),Log(WARNING,The fax engine dialed a call Faxbot did not ask for and it was refused.)
 same => n,Hangup(21)

; Runs on the trunk channel before it dials: T.38 requests from this side
; when the gateway is on, the optional RFC 6913 fax preference, and the
; handler that passes the trunk's details to the engine's channel at hang-up.
[faxbot-engine-dial]
exten => s,1,Set(CHANNEL(hangup_handler_push)=faxbot-engine-trunk-done,s,1)
 same => n,GotoIf($["${FAXBOT_GATEWAY}" != "yes"]?preference)
 same => n,Set(FAXOPT(negotiate_both)=yes)
 same => n(preference),GotoIf($["${FAXBOT_PREFERENCE}" != "1"]?done)
 same => n,Set(PJSIP_HEADER(add,Accept-Contact)=*\;+sip.fax="t38")
 same => n(done),Return()

[faxbot-engine-answered]
exten => s,1,Set(SHARED(FAXBOT_ANSWERED,${FAXBOT_ENGINE_CHANNEL})=${EPOCH})
 same => n,Set(FAXBOT_CALLID=${CHANNEL(pjsip,call-id)})
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_CALLID64,FAXBOT_CALLID))
 same => n,Set(SHARED(FAXBOT_CALLID64,${FAXBOT_ENGINE_CHANNEL})=${FAXBOT_CALLID64})
 same => n,Return()

; Runs on the trunk channel when it hangs up, in that channel's own thread,
; while the engine's channel may already be gone (so nothing is written to it):
; what only the trunk knows goes out as its own event, which Faxbot joins to the
; engine's by the fax and attempt. T38 is the carrier leg's state at hang-up;
; RtpRx (RTCP packets received) is read only while the leg is audio, because a
; leg in T.38 has no RTP session to read it from.
[faxbot-engine-trunk-done]
exten => s,1,Set(FAXBOT_T38=${CHANNEL(pjsip,t38state)})
 same => n,Set(FAXBOT_RTPRX=)
 same => n,GotoIf($["${FAXBOT_CALLID64}" = ""]?emit)
 same => n,GotoIf($["${FAXBOT_T38}" != "DISABLED" & "${FAXBOT_T38}" != "REJECTED"]?emit)
 same => n,Set(FAXBOT_RTPRX=${FILTER(0123456789,${CHANNEL(rtcp,rxcount)})})
 same => n(emit),UserEvent(FaxEngineCall,Direction:out,Side:trunk,JobID:${FAXBOT_ENGINE_JOB},AttemptID:${FAXBOT_ENGINE_ATTEMPT},T38:${FAXBOT_T38},Cause:${HANGUPCAUSE},RtpRx:${FAXBOT_RTPRX},CallID64:${FAXBOT_CALLID64})
 same => n,Return()

; One record per engine call, on the engine's channel: the carrier's Call-ID
; (the carrier bills the call under it; written here when the call was
; answered), when it was answered and ended, and T.38: the gateway's fax
; session number (T38Session, 0 when T.38 never started; the gateway turns the
; call back to audio at the end, so the trunk's state at hang-up is no evidence
; of T.38). With the gateway on, its own outcome too (GwStatus, GwError,
; GwPages, GwRate and its words in Gw64), so a T.38 call that carried nothing
; shows where it stopped. The trunk's side comes in its own event (above); the
; fax result itself comes from the engine. Not FaxResult: that event is the
; built-in engine's delivery result.
[faxbot-engine-result]
exten => s,1,Set(FAXBOT_T38_SESSION=0)
 same => n,Set(FAXBOT_GW_STATUS=)
 same => n,Set(FAXBOT_GW_ERROR=)
 same => n,Set(FAXBOT_GW_PAGES=)
 same => n,Set(FAXBOT_GW_RATE=)
 same => n,Set(FAXBOT_GW64=)
 same => n,GotoIf($["${FAXBOT_GATEWAY}" != "yes"]?emit)
 same => n,Set(FAXBOT_T38_SESSION=${FILTER(0123456789,${FAXOPT(sessionid)})})
 same => n,Set(FAXBOT_GW_STATUS=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXOPT(status)})})
 same => n,Set(FAXBOT_GW_ERROR=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_,${FAXOPT(error)})})
 same => n,Set(FAXBOT_GW_PAGES=${FILTER(0123456789,${FAXOPT(pages)})})
 same => n,Set(FAXBOT_GW_RATE=${FILTER(0123456789,${FAXOPT(rate)})})
 same => n,Set(FAXBOT_GW_TEXT=${FAXOPT(statusstr)})
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_GW64,FAXBOT_GW_TEXT))
 same => n(emit),UserEvent(FaxEngineCall,Direction:out,Side:engine,JobID:${JOBID},AttemptID:${FAXATTEMPT},Engine:hylafax,Gateway:${FAXBOT_GATEWAY},T38Session:${FAXBOT_T38_SESSION},GwStatus:${FAXBOT_GW_STATUS},GwError:${FAXBOT_GW_ERROR},GwPages:${FAXBOT_GW_PAGES},GwRate:${FAXBOT_GW_RATE},Gw64:${FAXBOT_GW64},Started:${FAXBOT_STARTED},Answered:${SHARED(FAXBOT_ANSWERED)},Ended:${EPOCH},Cause:${HANGUPCAUSE},DialStatus:${DIALSTATUS},CallID64:${SHARED(FAXBOT_CALLID64)})
 same => n,Return()

; Calls the carrier sends to this trunk. Caller-chosen values are reduced to
; digits and plus signs, or base64 encoded, before the notification command
; runs; the shared secret and API address come from the container environment.
[faxbot-inbound]
exten => _[+0-9A-Za-z].,1,Set(FAXBOT_DID=${FILTER(0123456789+,${EXTEN})})
 same => n,GotoIf($[${LEN(${FAXBOT_DID})} = ${LEN(${EXTEN})}]?receive)
 same => n,Set(FAXBOT_DID=)
 same => n(receive),Goto(faxbot-inbound-receive,s,1)
exten => s,1,Set(FAXBOT_DID=)
 same => n,Goto(faxbot-inbound-receive,s,1)

; FAXBOT_TRUNK: the trunk account the call came in on, set by its endpoint (set_var in pjsip.conf); empty on
; the first trunk, whose endpoint sets nothing. Anything but a trunk key is cleared here, before any use.
; FAXBOT_PEER: the enrolled partner whose Faxbot called inside the encrypted tunnel (its peer endpoint's set_var,
; direct/peer_call.py), never a carrier call. The built-in engine answers it, with Internet Aware Fax (FAXBOT_IAF,
; the same endpoint), so the SSL Fax engine's lines are passed over.
[faxbot-inbound-receive]
exten => s,1,Set(FAXBOT_STARTED=${EPOCH})
 same => n,Set(FAXBOT_TRUNK=${IF($[${REGEX("^[a-z0-9][a-z0-9_-]*$" ${FAXBOT_TRUNK})}]?${FAXBOT_TRUNK}:)})
 same => n,Set(FAXBOT_PEER=${IF($[${REGEX("^[a-f0-9]{32}$" ${FAXBOT_PEER})}]?${FAXBOT_PEER}:)})
 same => n,GotoIf($[${LEN(${FAXBOT_DID})} >= 7]?caller)
 same => n,Set(FAXBOT_TO=${PJSIP_HEADER(read,To)})
 same => n,Set(FAXBOT_TO=${CUT(FAXBOT_TO,@,1)})
 same => n,Set(FAXBOT_DID=${FILTER(0123456789+,${CUT(FAXBOT_TO,:,2)})})
 same => n(caller),Set(FAXBOT_CALLER=${FILTER(0123456789+,${CALLERID(num)})})
 same => n,Set(FAXBOT_CALLID=${CHANNEL(pjsip,call-id)})
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_CALLID64,FAXBOT_CALLID))
; A sender you blocked is turned away here, before anything answers the call (no answer: no billed seconds).
 same => n,Gosub(faxbot-screen,s,1)
 same => n,GotoIf($["${FAXBOT_SCREENED}" = "1"]?screened)
 same => n,Gosub(faxbot-sip-headers,s,1)
 same => n,Gosub(faxbot-caller-mode,s,1)
 same => n,Gosub(faxbot-options,s,1)
 same => n,GotoIf($["${FAXBOT_ENGINE_LINES}" = "" | "${FAXBOT_PEER}" != ""]?builtin)
 same => n,Gosub(faxbot-engine-in,s,1)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?engine-done)
 same => n(builtin),Set(FAXBOT_FILE=/faxdata/inbound/${FILTER(0123456789.,${UNIQUEID})}.tiff)
 same => n,Set(CHANNEL(hangup_handler_push)=faxbot-inbound-done,s,1)
 same => n,Gosub(faxbot-caller,s,1)
 same => n,Answer()
 same => n,Set(FAXBOT_ANSWERED=${EPOCH})
 same => n,Set(FAXOPT(ecm)=${FAXBOT_IN_ECM})
 same => n,Set(FAXOPT(maxrate)=${IF($["${PJSIP_ENDPOINT(${CHANNEL(endpoint)},t38_udptl)}" = "false" | "${FAXBOT_IN_AUDIO}" = "yes"]?${FAXBOT_IN_AUDIO_RATE}:${FAXBOT_IN_RATE})})
; f: when the carrier refuses T.38 (Telnyx answered HumbleFax's calls with a refusal on 2026-10-04),
; the fax goes on as audio instead of failing. F (faxbot-caller-mode): audio fax for this caller only.
 same => n,ReceiveFAX(${FAXBOT_FILE},${IF($["${FAXBOT_IN_AUDIO}" = "yes"]?F:f)})
 same => n,Hangup()
 same => n(engine-done),Hangup()
; 603 Decline on the unanswered call; Hangup(21) (403) only if PJSIPHangup could not send it.
 same => n(screened),PJSIPHangup(603)
 same => n,Hangup(21)

; A forwarded call (inbound/diversion.py): when a call has a Diversion or History-Info header, or an Identity
; header for a diversion (ppt div), its Diversion, History-Info and Identity headers (up to three of each) are kept
; for Faxbot in /faxdata/inbound/<call token>.sip, one line each: the header name and its value in base64. Both fax
; engines' hand-overs find them by the call's token (the digits of UNIQUEID). Any other call writes nothing.
[faxbot-sip-headers]
exten => s,1,Set(FAXBOT_SIP_FILE=/faxdata/inbound/${FILTER(0123456789,${UNIQUEID})}.sip)
 same => n,Set(FAXBOT_HEADER=${PJSIP_HEADER(read,Diversion)}${PJSIP_HEADER(read,History-Info)})
 same => n,GotoIf($[${LEN(${FAXBOT_HEADER})} > 0]?keep)
 same => n,GotoIf($[${REGEX("ppt=.?div" ${PJSIP_HEADER(read,Identity,1)}${PJSIP_HEADER(read,Identity,2)})}]?keep)
; A STIR/SHAKEN PASSporT, or the carrier's verstat, for the caller-verification stamp (inbound/caller_check.py).
 same => n,GotoIf($[${LEN(${PJSIP_HEADER(read,Identity,1)})} > 0]?keep)
 same => n,GotoIf($[${REGEX("verstat=" ${PJSIP_HEADER(read,P-Asserted-Identity,1)}${PJSIP_HEADER(read,From,1)})}]?keep)
 same => n,Return()
 same => n(keep),Gosub(faxbot-sip-header,s,1(Diversion,1))
 same => n,Gosub(faxbot-sip-header,s,1(Diversion,2))
 same => n,Gosub(faxbot-sip-header,s,1(History-Info,1))
 same => n,Gosub(faxbot-sip-header,s,1(History-Info,2))
 same => n,Gosub(faxbot-sip-header,s,1(History-Info,3))
 same => n,Gosub(faxbot-sip-header,s,1(Identity,1))
 same => n,Gosub(faxbot-sip-header,s,1(Identity,2))
 same => n,Gosub(faxbot-sip-header,s,1(Identity,3))
 same => n,Gosub(faxbot-sip-header,s,1(P-Asserted-Identity,1))
 same => n,Gosub(faxbot-sip-header,s,1(From,1))
 same => n,Return()

; One header (ARG1, the ARG2th of that name) as a line of the call's .sip file; nothing when the call has none.
; FILE's line mode with Unix line ends (format u) appends, creating the file for the first line.
[faxbot-sip-header]
exten => s,1,Set(FAXBOT_HEADER=${PJSIP_HEADER(read,${ARG1},${ARG2})})
 same => n,GotoIf($[${LEN(${FAXBOT_HEADER})} = 0]?done)
 same => n,Set(FILE(${FAXBOT_SIP_FILE},,,al,u)=${ARG1} ${BASE64_ENCODE(${FAXBOT_HEADER})})
 same => n(done),Return()

; Callers whose fax over IP (T.38) calls to Faxbot failed recently, while their audio fax calls did not, are
; answered with audio fax: engine_learning.py keeps "audio" under faxbot-inmode in Asterisk's database, by the
; caller's digits as the screen reads them (FAXBOT_SCREEN_KEY). It runs only after the junk screen, so a
; blocked caller is turned away before it and is never answered. A caller that asks for T.38 is refused and goes
; on as audio; one that stays silent about ten seconds before asking (Asterisk's SendFAX z) misses the three DIS
; and fails, which teaches "audio failed" too, so that caller goes back to the usual settings.
[faxbot-caller-mode]
exten => s,1,Set(FAXBOT_IN_AUDIO=)
 same => n,GotoIf($[${LEN(${FAXBOT_SCREEN_KEY})} < 3]?done)
 same => n,GotoIf($[${DB_EXISTS(faxbot-inmode/${FAXBOT_SCREEN_KEY})} = 0]?done)
 same => n,GotoIf($["${DB_RESULT}" != "audio"]?done)
 same => n,Set(FAXBOT_IN_AUDIO=yes)
 same => n(done),Return()

; Junk senders you marked (Numbers, Blocked senders), checked before the call is answered. Faxbot keeps one key
; per way a carrier may present the number (inbound/screening.py), each holding the entry's expiry in epoch
; seconds: an entry whose time has passed is ignored here, even while Faxbot is not running. A caller with no
; number, or one who withholds it, is never screened. Each rejection is queued in faxbot-screened (Faxbot records
; it once, even if it was not connected at that moment) and announced as FaxScreened.
[faxbot-screen]
exten => s,1,Set(FAXBOT_SCREENED=0)
 same => n,Set(FAXBOT_SCREEN_KEY=${FILTER(0123456789,${FAXBOT_CALLER})})
 same => n,GotoIf($[${LEN(${FAXBOT_SCREEN_KEY})} < 3]?done)
 same => n,GotoIf($["${CALLERID(num-pres):0:6}" = "prohib"]?done)
 same => n,GotoIf($[${DB_EXISTS(faxbot-screen/${FAXBOT_SCREEN_KEY})} = 0]?done)
 same => n,GotoIf($[0${FILTER(0123456789,${DB_RESULT})} <= ${EPOCH}]?done)
 same => n,Set(FAXBOT_SCREENED=1)
 same => n,Set(DB(faxbot-screened/${EPOCH}.${FILTER(0123456789.,${UNIQUEID})})=${FAXBOT_CALLER}:${FAXBOT_DID}:${FAXBOT_CALLID64})
 same => n,UserEvent(FaxScreened,Caller:${FAXBOT_CALLER},DID:${FAXBOT_DID},At:${EPOCH},CallID64:${FAXBOT_CALLID64})
 same => n(done),Return()

; The SSL Fax engine's lines answer the call (the first free line). Asterisk's
; name for the call and the called number travel as the caller name
; (<token>.<digits>, and .<trunk> for a trunk other than the first; the engine's
; modems pass no dialed number), so the engine's hand-over and this call's
; record meet, and the fax is recorded on the trunk it came in on.
; With T.38 on, the fax gateway joins the carrier's T.38 to the engine's audio
; (and asks for T.38 itself when the engine answers with fax tones; a refusal
; leaves the call audio). When no line can
; take the call (the engine is not running or every line is busy) the built-in
; engine answers it instead, on the same call.
[faxbot-engine-in]
exten => s,1,Set(FAXBOT_TOKEN=${FILTER(0123456789,${UNIQUEID})})
 same => n,Set(_FAXBOT_INBOUND_CHANNEL=${CHANNEL(name)})
 same => n,Set(CHANNEL(hangup_handler_push)=faxbot-engine-in-done,s,1)
 same => n,Set(CALLERID(name)=${FAXBOT_TOKEN}.${FILTER(0123456789,${FAXBOT_DID})})
 same => n,GotoIf($["${FAXBOT_TRUNK}" = ""]?named)
 same => n,Set(CALLERID(name)=${CALLERID(name)}.${FAXBOT_TRUNK})
 same => n(named),Set(FAXBOT_GATEWAY=no)
 same => n,GotoIf($["${PJSIP_ENDPOINT(${CHANNEL(endpoint)},t38_udptl)}" = "false"]?dial)
 same => n,GotoIf($["${DB(faxbot-engine/t38)}" = "audio"]?dial)
 same => n,GotoIf($["${FAXBOT_IN_AUDIO}" = "yes"]?dial)
 same => n,Set(FAXOPT(gateway)=yes)
 same => n,Set(FAXBOT_GATEWAY=yes)
; The lines in turn, the first free one first: ringing every line at once made two engine sessions start
; for one call. A line on a call (or not registered) is passed over at once; a free line rings for up to
; 12 s (the engine answers on the first ring). All lines together ring for at most 20 s, as before: then
; the built-in engine answers, well inside the 35 s a sending fax machine waits for an answer.
 same => n(dial),Set(FAXBOT_LINE=0)
 same => n,Set(FAXBOT_LINES_TRIED=)
 same => n,Set(FAXBOT_HUNT_START=${EPOCH})
 same => n,Set(FAXBOT_LINE_COUNT=${FIELDQTY(FAXBOT_ENGINE_LINES,&)})
 same => n(next),Set(FAXBOT_LINE=$[${FAXBOT_LINE} + 1])
 same => n,GotoIf($[${FAXBOT_LINE} > ${FAXBOT_LINE_COUNT} | ${FAXBOT_LINE} > 8]?none)
 same => n,Set(FAXBOT_RING=$[20 - (${EPOCH} - ${FAXBOT_HUNT_START})])
 same => n,GotoIf($[${FAXBOT_RING} < 1]?none)
 same => n,Set(FAXBOT_RING=${IF($[${FAXBOT_RING} > 12]?12:${FAXBOT_RING})})
 same => n,Set(FAXBOT_LINE_STATE=${DEVICE_STATE(IAX2/faxbot-line${FAXBOT_LINE})})
 same => n,GotoIf($["${FAXBOT_LINE_STATE}" != "NOT_INUSE" & "${FAXBOT_LINE_STATE}" != "UNKNOWN"]?next)
 same => n,Dial(IAX2/faxbot-line${FAXBOT_LINE}/${FAXBOT_ENGINE_DID},${FAXBOT_RING},U(faxbot-engine-in-answered))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
; A line that just ended a call turns calls away for a few seconds (busy): not a fault.
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?next)
 same => n,Set(FAXBOT_LINES_TRIED=${FAXBOT_LINES_TRIED}${FAXBOT_LINE}:${DIALSTATUS} )
 same => n,Goto(next)
; A free line rang and did not answer: Faxbot asks the engine to start again once no call is up, and the
; trunk page says why. The built-in engine answers this call.
 same => n(none),GotoIf($["${FAXBOT_LINES_TRIED}" = ""]?builtin)
 same => n,UserEvent(FaxEngineMissed,Token:${FAXBOT_TOKEN},DID:${FAXBOT_DID},Caller:${FAXBOT_CALLER},Started:${FAXBOT_STARTED},Lines:${FAXBOT_LINES_TRIED})
 same => n(builtin),Set(CHANNEL(hangup_handler_pop)=)
 same => n,Set(FAXOPT(gateway)=no)
 same => n,Set(CALLERID(name)=)
 same => n(done),Return()

[faxbot-engine-in-answered]
exten => s,1,Set(SHARED(FAXBOT_ANSWERED,${FAXBOT_INBOUND_CHANNEL})=${EPOCH})
 same => n,Return()

[faxbot-engine-in-done]
exten => s,1,Set(FAXBOT_T38=${CHANNEL(pjsip,t38state)})
 same => n,Set(FAXBOT_T38_SESSION=0)
 same => n,Set(FAXBOT_RTPRX=)
 same => n,Set(FAXBOT_GW_STATUS=)
 same => n,Set(FAXBOT_GW_ERROR=)
 same => n,GotoIf($["${FAXBOT_T38}" != "DISABLED" & "${FAXBOT_T38}" != "REJECTED"]?gateway)
 same => n,Set(FAXBOT_RTPRX=${FILTER(0123456789,${CHANNEL(rtcp,rxcount)})})
 same => n(gateway),GotoIf($["${FAXBOT_GATEWAY}" != "yes"]?emit)
 same => n,Set(FAXBOT_T38_SESSION=${FILTER(0123456789,${FAXOPT(sessionid)})})
 same => n,Set(FAXBOT_GW_STATUS=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXOPT(status)})})
 same => n,Set(FAXBOT_GW_ERROR=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_,${FAXOPT(error)})})
 same => n(emit),UserEvent(FaxEngineCall,Direction:in,Token:${FAXBOT_TOKEN},DID:${FAXBOT_DID},Trunk:${FAXBOT_TRUNK},Caller:${FAXBOT_CALLER},Engine:hylafax,Line:${FAXBOT_LINE},Gateway:${FAXBOT_GATEWAY},T38:${FAXBOT_T38},T38Session:${FAXBOT_T38_SESSION},GwStatus:${FAXBOT_GW_STATUS},GwError:${FAXBOT_GW_ERROR},Started:${FAXBOT_STARTED},Answered:${SHARED(FAXBOT_ANSWERED)},Ended:${EPOCH},Cause:${HANGUPCAUSE},RtpRx:${FAXBOT_RTPRX},CallID64:${FAXBOT_CALLID64})
 same => n,Return()

; Runs once when the inbound call ends, including a caller hangup mid-fax.
; A stored image is handed to Faxbot; the notifier prints "ok" or why the
; hand-over failed. A failed hand-over is logged as an ERROR and reported to
; Faxbot's manager connection as FaxInboundCall with Handover set, so Recent
; calls and the Dashboard say so; the image stays in /faxdata/inbound and Faxbot
; brings it in by itself once the cause is fixed. A call that left no image is
; reported as FaxInboundCall too, so the call still has a record.
[faxbot-inbound-done]
exten => s,1,Set(FAXBOT_ENDED=${EPOCH})
 same => n,Gosub(faxbot-frames,s,1(in,,))
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_STATION64,REMOTESTATIONID))
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_ERROR64,FAXERROR))
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_STATUS64,FAXSTATUSSTRING))
 same => n,GotoIf($["${STAT(e,${FAXBOT_FILE})}" = "1"]?stored)
 same => n,Set(FAXBOT_RTPTX=)
 same => n,Set(FAXBOT_RTPRX=)
 same => n,GotoIf($["${FAXMODE}" = "T38"]?report)
 same => n,Set(FAXBOT_RTPTX=${CHANNEL(rtcp,txcount)})
 same => n,Set(FAXBOT_RTPRX=${CHANNEL(rtcp,rxcount)})
 same => n(report),UserEvent(FaxInboundCall,DID:${FAXBOT_DID},Trunk:${FAXBOT_TRUNK},Caller:${FAXBOT_CALLER},Status:${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXSTATUS})},Error64:${FAXBOT_ERROR64},Status64:${FAXBOT_STATUS64},Pages:${FILTER(0123456789,${FAXPAGES})},Mode:${FILTER(T38audio,${FAXMODE})},Station64:${FAXBOT_STATION64},Started:${FAXBOT_STARTED},Answered:${FAXBOT_ANSWERED},Ended:${FAXBOT_ENDED},UniqueID:${FILTER(0123456789.,${UNIQUEID})},Cause:${HANGUPCAUSE},RtpTx:${FAXBOT_RTPTX},RtpRx:${FAXBOT_RTPRX},CallID64:${FAXBOT_CALLID64},Rate:${FILTER(0123456789,${FAXBITRATE})},Resolution:${FILTER(0123456789x,${FAXRESOLUTION})})
 same => n,Goto(done)
 same => n(stored),Set(FAXBOT_HANDOVER=${SHELL(/usr/local/bin/faxbot-inbound-notify file=${FAXBOT_FILE} did=${FAXBOT_DID} caller=${FAXBOT_CALLER} status=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXSTATUS})} pages=${FILTER(0123456789,${FAXPAGES})} mode=${FILTER(T38audio,${FAXMODE})} started=${FAXBOT_STARTED} answered=${FAXBOT_ANSWERED} ended=${FAXBOT_ENDED} uniqueid=${FILTER(0123456789.,${UNIQUEID})} station64=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=,${FAXBOT_STATION64})} callid64=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=,${FAXBOT_CALLID64})} rate=${FILTER(0123456789,${FAXBITRATE})} resolution=${FILTER(0123456789x,${FAXRESOLUTION})} sub=${FILTER(0123456789abcdef,${FAXBOT_FAR_SUB})} peer=${FILTER(0123456789abcdef,${FAXBOT_PEER})} trunk=${FAXBOT_TRUNK})})
 same => n,Set(FAXBOT_HANDOVER=${FILTER(abcdefghijklmnopqrstuvwxyz_,${FAXBOT_HANDOVER})})
 same => n,GotoIf($["${FAXBOT_HANDOVER}" = "ok"]?done)
 same => n,Set(FAXBOT_HANDOVER=${IF($["${FAXBOT_HANDOVER}" = ""]?failed:${FAXBOT_HANDOVER})})
 same => n,Log(ERROR,Received fax ${FILTER(0123456789.,${UNIQUEID})} was not handed to Faxbot (${FAXBOT_HANDOVER}). It stays in /faxdata/inbound and Faxbot brings it in once the cause is fixed.)
 same => n,UserEvent(FaxInboundCall,DID:${FAXBOT_DID},Trunk:${FAXBOT_TRUNK},Caller:${FAXBOT_CALLER},Status:${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXSTATUS})},Error64:${FAXBOT_ERROR64},Status64:${FAXBOT_STATUS64},Pages:${FILTER(0123456789,${FAXPAGES})},Mode:${FILTER(T38audio,${FAXMODE})},Station64:${FAXBOT_STATION64},Started:${FAXBOT_STARTED},Answered:${FAXBOT_ANSWERED},Ended:${FAXBOT_ENDED},UniqueID:${FILTER(0123456789.,${UNIQUEID})},Cause:${HANGUPCAUSE},RtpTx:${FAXBOT_RTPTX},RtpRx:${FAXBOT_RTPRX},CallID64:${FAXBOT_CALLID64},Rate:${FILTER(0123456789,${FAXBITRATE})},Resolution:${FILTER(0123456789x,${FAXRESOLUTION})},Handover:${FAXBOT_HANDOVER})
 same => n(done),Return()

; What Faxbot learned about one caller (engine_frames.py keeps these keys in Asterisk's database, by the
; caller's digits as the screen reads them): faxbot-iaf holds "peer" or "endpoint" for an enrolled partner or a fax
; server you approved for Internet Aware Fax, and faxbot-inrate holds 14400 for a caller whose calls trained
; cleanly at that speed, lifting the audio receive cap for that caller only. Nothing here for anyone else.
[faxbot-caller]
exten => s,1,GotoIf($[${LEN(${FAXBOT_SCREEN_KEY})} < 3]?done)
 same => n,GotoIf($[${DB_EXISTS(faxbot-iaf/${FAXBOT_SCREEN_KEY})} = 0]?rate)
 same => n,Set(FAXBOT_IAF=${FILTER(abcdefghijklmnopqrstuvwxyz,${DB_RESULT})})
 same => n(rate),GotoIf($[${DB_EXISTS(faxbot-inrate/${FAXBOT_SCREEN_KEY})} = 0]?done)
 same => n,GotoIf($["${DB_RESULT}" != "14400"]?done)
 same => n,Set(FAXBOT_IN_AUDIO_RATE=14400)
 same => n(done),Return()

; What the far end's fax machine said on a built-in engine call (patch 0004 puts it on the channel when the fax
; session ends), as one FaxFrames event for sent (ARG1 out, ARG2 fax, ARG3 attempt) and received (in) calls:
; hex T.30 frames (DIS, first and last DCS, SUB, NSF, each at most 32 octets; CSA and TSA whole, up to 83), each DCS's speed code,
; trainings and failures to train, Internet Aware Fax, and when T.38 started and who asked. Nothing when no fax
; session ran.
[faxbot-frames]
exten => s,1,GotoIf($["${FAXBOT_TRAININGS}${FAXBOT_FAR_DIS}${FAXBOT_T38_AT}" = ""]?done)
 same => n,UserEvent(FaxFrames,Direction:${ARG1},JobID:${ARG2},AttemptID:${ARG3},UniqueID:${FILTER(0123456789.,${UNIQUEID})},DID:${FAXBOT_DID},Caller:${FAXBOT_CALLER},Mode:${FILTER(T38audio,${FAXMODE})},Status:${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXSTATUS})},Answered:${FILTER(0123456789,${FAXBOT_ANSWERED})},T38At:${FILTER(0123456789,${FAXBOT_T38_AT})},T38By:${FILTER(abcdefghijklmnopqrstuvwxyz,${FAXBOT_T38_BY})},T38Now:${FILTER(yes,${FAXBOT_T38_NOW})},Iaf:${FILTER(abcdefghijklmnopqrstuvwxyz,${FAXBOT_IAF_USED})},Dis:${FILTER(0123456789abcdef,${FAXBOT_FAR_DIS})},DcsFirst:${FILTER(0123456789abcdef,${FAXBOT_DCS_FIRST})},DcsLast:${FILTER(0123456789abcdef,${FAXBOT_DCS_LAST})},DcsSent:${FILTER(01,${FAXBOT_DCS_SENT})},Rates:${FILTER(0123456789abcdef.,${FAXBOT_DCS_RATES})},Csa:${FILTER(0123456789abcdef,${FAXBOT_FAR_CSA})},Tsa:${FILTER(0123456789abcdef,${FAXBOT_FAR_TSA})},Sub:${FILTER(0123456789abcdef,${FAXBOT_FAR_SUB})},Nsf:${FILTER(0123456789abcdef,${FAXBOT_FAR_NSF})},Trainings:${FILTER(0123456789,${FAXBOT_TRAININGS})},Ftt:${FILTER(0123456789,${FAXBOT_FTT})})
 same => n(done),Return()

; Before a peer fax call to an enrolled partner (direct/peer_call.py, ami.peer_route): which interface this
; container's network would send a call to the partner's tunnel address through, and its kind (wireguard for a
; WireGuard tunnel), as one FaxPeerRoute event for Faxbot's check. A Local channel Faxbot originates runs it;
; nothing is dialed. The address and the check token are reduced to their characters before use.
[faxbot-peer-route]
exten => s,1,Set(FAXBOT_ROUTE=${SHELL(/usr/local/bin/faxbot-peer-route ${FILTER(0123456789abcdefABCDEF.:,${FAXBOT_PEER_ADDRESS})})})
 same => n,UserEvent(FaxPeerRoute,Check:${FILTER(0123456789abcdef,${FAXBOT_CHECK})},Route:${FILTER(abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_./,${FAXBOT_ROUTE})})
 same => n,Hangup()

; Base64 of one variable's value into another; empty stays empty, because
; BASE64_ENCODE logs a warning for every empty value. ARG1: variable to set,
; ARG2: name of the variable to encode.
[faxbot-b64]
exten => s,1,Set(${ARG1}=)
 same => n,GotoIf($[${LEN(${${ARG2}})} = 0]?done)
 same => n,Set(${ARG1}=${BASE64_ENCODE(${${ARG2}})})
 same => n(done),Return()

; [faxbot-options] (receiving speed and error correction, and the SSL Fax
; engine's lines) is written by Faxbot with the trunk; start.sh loads it from
; Faxbot's data folder, or writes the defaults before Faxbot has.
#include extensions-options.conf
