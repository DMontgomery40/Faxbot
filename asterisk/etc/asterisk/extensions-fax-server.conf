; Fax servers that send their faxes through Faxbot (api/app/fax_servers.py): OpenText RightFax with a Brooktrout
; SR140, or any fax server or PBX that sends faxes to a SIP gateway.
;
; A fax server's endpoint (pjsip.conf, written by Faxbot from Delivery setup) is found only by its one address on
; your network and checked with SIP digest authentication, then its calls come here with FAXBOT_FAX_SERVER and
; FAXBOT_FAX_SERVER_ADDRESS set. Before answering, Faxbot is asked (faxbot-fax-server admit) whether it takes the
; fax: the number dialled, the server's countries and caps, the dialing guard and the sending rules. The answer is
; one line: send:+E164 (answer and receive, then send on), receive:+E164 (one of your own numbers: an ordinary
; received fax, as from a carrier), or refuse:CODE (refused unanswered with that SIP code, so the fax server shows
; the fax as failed). Anything else, or no answer, is refused with 503. A fax server call is never bridged to the
; trunk: store and forward, so no device on your network reaches the trunk directly and a call that fails half way
; sends nothing.
[faxbot-fax-server]
exten => _[+0-9*#].,1,Set(FAXBOT_FAX_SERVER=${IF($[${REGEX("^[a-f0-9]{32}$" ${FAXBOT_FAX_SERVER})}]?${FAXBOT_FAX_SERVER}:)})
 same => n,GotoIf($["${FAXBOT_FAX_SERVER}" = ""]?refuse)
; The address the call really came from must be the one the server was enrolled with (pjsip.conf also permits only
; that address on its endpoint).
 same => n,Set(FAXBOT_REMOTE=${CHANNEL(pjsip,remote_addr)})
 same => n,Set(FAXBOT_REMOTE=${FILTER(0123456789.,${CUT(FAXBOT_REMOTE,:,1)})})
 same => n,GotoIf($["${FAXBOT_REMOTE}" = "" | "${FAXBOT_REMOTE}" != "${FAXBOT_FAX_SERVER_ADDRESS}"]?refuse)
 same => n,Set(FAXBOT_DIALED=${FILTER(0123456789+*#,${EXTEN})})
 same => n,Set(FAXBOT_CALLER=${FILTER(0123456789+,${CALLERID(num)})})
 same => n,Set(FAXBOT_CALLID=${CHANNEL(pjsip,call-id)})
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_CALLID64,FAXBOT_CALLID))
 same => n,Set(FAXBOT_TOKEN=${FILTER(0123456789.,${UNIQUEID})})
 same => n,Set(FAXBOT_ADMIT=${SHELL(/usr/local/bin/faxbot-fax-server admit server=${FAXBOT_FAX_SERVER} address=${FAXBOT_REMOTE} dialed=${FILTER(0123456789+*#,${FAXBOT_DIALED})} caller=${FAXBOT_CALLER} callid64=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=,${FAXBOT_CALLID64})} uniqueid=${FAXBOT_TOKEN})})
 same => n,Set(FAXBOT_ADMIT=${FILTER(abcdefghijklmnopqrstuvwxyz0123456789:+,${FAXBOT_ADMIT})})
 same => n,Set(FAXBOT_VERDICT=${CUT(FAXBOT_ADMIT,:,1)})
 same => n,Set(FAXBOT_NUMBER=${FILTER(0123456789+,${CUT(FAXBOT_ADMIT,:,2)})})
 same => n,GotoIf($["${FAXBOT_VERDICT}" = "send" & ${LEN(${FAXBOT_NUMBER})} > 7]?send)
 same => n,GotoIf($["${FAXBOT_VERDICT}" = "receive" & ${LEN(${FAXBOT_NUMBER})} > 7]?receive)
 same => n,Set(FAXBOT_CODE=${FILTER(0123456789,${CUT(FAXBOT_ADMIT,:,2)})})
 same => n,Set(FAXBOT_CODE=${IF($["${FAXBOT_VERDICT}" = "refuse" & ${LEN(${FAXBOT_CODE})} = 3]?${FAXBOT_CODE}:503)})
 same => n,PJSIPHangup(${FAXBOT_CODE})
 same => n,Hangup(21)
; One of your own numbers: the ordinary receiving path, filed under that number.
 same => n(receive),Set(FAXBOT_DID=${FAXBOT_NUMBER})
 same => n,Set(FAXBOT_FAX_SERVER=)
 same => n,Goto(faxbot-inbound-receive,s,1)
; Answer and take the whole fax. With T.38 on, Faxbot asks for it itself when the server has not (negotiate_both).
 same => n(send),Set(FAXBOT_FILE=/faxdata/fax-server/${FAXBOT_TOKEN}.tiff)
 same => n,Set(FAXBOT_STARTED=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=faxbot-fax-server-done,s,1)
 same => n,Answer()
 same => n,Set(FAXBOT_ANSWERED=${EPOCH})
 same => n,Set(FAXOPT(ecm)=yes)
 same => n,Set(FAXOPT(maxrate)=14400)
 same => n,Set(FAXOPT(negotiate_both)=yes)
 same => n,ReceiveFAX(${FAXBOT_FILE},f)
 same => n,Hangup()
 same => n(refuse),PJSIPHangup(403)
 same => n,Hangup(21)
exten => s,1,PJSIPHangup(403)
 same => n,Hangup(21)

; Once the call ends, the fax goes to Faxbot with the call it belongs to; with no whole fax (status not SUCCESS, or no
; image), Faxbot records that nothing was sent on. When the hand-over fails, the image stays in /faxdata/fax-server
; and Faxbot closes the call itself after a while, without sending it, and tells the server's contact.
[faxbot-fax-server-done]
exten => s,1,Set(FAXBOT_ENDED=${EPOCH})
 same => n,Set(FAXBOT_HANDOVER=${SHELL(/usr/local/bin/faxbot-fax-server handover server=${FAXBOT_FAX_SERVER} file=${FAXBOT_FILE} status=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXSTATUS})} pages=${FILTER(0123456789,${FAXPAGES})} uniqueid=${FAXBOT_TOKEN} callid64=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=,${FAXBOT_CALLID64})})})
 same => n,Set(FAXBOT_HANDOVER=${FILTER(abcdefghijklmnopqrstuvwxyz_,${FAXBOT_HANDOVER})})
 same => n,GotoIf($["${FAXBOT_HANDOVER}" = "ok"]?done)
 same => n,Log(ERROR,Fax server call ${FAXBOT_TOKEN} was not handed to Faxbot (${FAXBOT_HANDOVER}). Faxbot does not send it and tells the server's contact.)
 same => n(done),Return()
