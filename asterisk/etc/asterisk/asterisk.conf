[directories]
astetcdir=/etc/asterisk
astmoddir=/usr/lib/asterisk/modules
astvarlibdir=/var/lib/asterisk
astdbdir=/var/lib/asterisk
; Asterisk adds "/keys" to this directory.
astkeydir=/var/lib/asterisk
astdatadir=/var/lib/asterisk
astagidir=/var/lib/asterisk/agi-bin
astspooldir=/var/spool/asterisk
astrundir=/var/run/asterisk
astlogdir=/var/log/asterisk

[options]
verbose=0
debug=0
documentation_language=en_US
; Asterisk parses the carrier's packets, so it runs as its own unprivileged user
; (uid and gid 5060, made in the Dockerfile) once start.sh, as root, has prepared
; its files. "asterisk -rx" run as root takes the group too, which lets it reach
; the control socket below.
runuser=asterisk
rungroup=asterisk

[files]
; The control socket: the asterisk user and its group only.
astctlpermissions=0660
