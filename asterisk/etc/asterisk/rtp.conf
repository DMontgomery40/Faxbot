[general]
; Audio (and fax sent as audio) uses 4500-4999; T.38 uses 4000-4499 (udptl.conf).
; Nothing is published or forwarded: Asterisk sends first from these ports and
; the carrier answers on the same flow. A public-address install narrows both
; ranges with FAXBOT_MEDIA_PORTS (docker-compose.public.yml).
rtpstart=4500
rtpend=4999
