[modules]
autoload=yes
require => func_base64.so
require => app_stack.so
require => app_userevent.so
; The inbound hand-over reads the notifier's answer with SHELL().
require => func_shell.so
; Ensure fax + pjsip from the pinned source build are enabled.
load => res_fax.so
load => res_fax_spandsp.so
load => chan_pjsip.so
load => res_pjsip.so
load => res_pjsip_outbound_publish.so
load => res_pjsip_pubsub.so
load => res_pjsip_session.so
load => res_pjsip_transport_websocket.so

; Modules a fax server does not use and that decline to load without their own
; configuration. Without these lines every start logged a burst of "declined to
; load" ERRORs; a healthy start now logs none. None of them ever loaded, so
; nothing that worked before changes.
noload => app_agent_pool.so
noload => app_alarmreceiver.so
noload => app_amd.so
noload => app_confbridge.so
noload => app_page.so
noload => app_festival.so
noload => app_followme.so
noload => app_queue.so
noload => cdr_csv.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_manager.so
noload => cel_sqlite3_custom.so
noload => chan_iax2.so
noload => chan_unistim.so
noload => pbx_ael.so
noload => pbx_dundi.so
noload => res_calendar.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_parking.so
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_pjsip_notify.so
noload => res_prometheus.so
noload => res_stun_monitor.so
; Loaded, but only to report a missing file: SQLite realtime storage and the
; CLI alias list, neither of which Faxbot uses.
noload => res_config_sqlite3.so
noload => res_clialiases.so
