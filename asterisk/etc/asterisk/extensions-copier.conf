; Copiers that fax through Faxbot as its own extensions (api/app/copier_extensions.py, research N22).
;
; A copier's endpoint (pjsip.conf, written by Faxbot from Delivery setup) sends its calls here with FAXBOT_COPIER
; set. Store and forward: the built-in engine receives the fax and hands it to Faxbot with the number the copier
; dialled (the Request-URI's user part, ${EXTEN}); Faxbot then sends it on through its own routing, rules and
; dialing guard. A copier call is never bridged to the trunk, so a device on your network can't reach the trunk
; directly and a call that fails half way loses no page. An endpoint without a copier ID is refused unanswered.
[faxbot-copier]
exten => _[+0-9].,1,Set(FAXBOT_COPIER=${IF($[${REGEX("^[a-f0-9]{32}$" ${FAXBOT_COPIER})}]?${FAXBOT_COPIER}:)})
 same => n,GotoIf($["${FAXBOT_COPIER}" = ""]?refuse)
 same => n,Set(FAXBOT_DIALED=${FILTER(0123456789+,${EXTEN})})
 same => n,Set(FAXBOT_STARTED=${EPOCH})
 same => n,Set(FAXBOT_CALLER=${FILTER(0123456789+,${CALLERID(num)})})
 same => n,Set(FAXBOT_CALLID=${CHANNEL(pjsip,call-id)})
 same => n,Gosub(faxbot-b64,s,1(FAXBOT_CALLID64,FAXBOT_CALLID))
 same => n,Set(FAXBOT_FILE=/faxdata/inbound/${FILTER(0123456789.,${UNIQUEID})}.tiff)
 same => n,Set(CHANNEL(hangup_handler_push)=faxbot-copier-done,s,1)
 same => n,Answer()
 same => n,Set(FAXBOT_ANSWERED=${EPOCH})
 same => n,Set(FAXOPT(ecm)=yes)
 same => n,ReceiveFAX(${FAXBOT_FILE},f)
 same => n,Hangup()
 same => n(refuse),PJSIPHangup(403)
 same => n,Hangup(21)
exten => s,1,PJSIPHangup(403)
 same => n,Hangup(21)

; The copier's fax, handed to Faxbot with its copier and the number it dialled (faxbot-inbound-notify copier= and
; dialed=). Faxbot queues it as an outbound fax from the copier's mailbox; it never files it as a received fax.
[faxbot-copier-done]
exten => s,1,Set(FAXBOT_ENDED=${EPOCH})
 same => n,GotoIf($["${STAT(e,${FAXBOT_FILE})}" = "1"]?stored)
 same => n,Return()
 same => n(stored),Set(FAXBOT_HANDOVER=${SHELL(/usr/local/bin/faxbot-inbound-notify file=${FAXBOT_FILE} caller=${FAXBOT_CALLER} status=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXSTATUS})} pages=${FILTER(0123456789,${FAXPAGES})} mode=${FILTER(T38audio,${FAXMODE})} started=${FAXBOT_STARTED} answered=${FAXBOT_ANSWERED} ended=${FAXBOT_ENDED} uniqueid=${FILTER(0123456789.,${UNIQUEID})} callid64=${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=,${FAXBOT_CALLID64})} copier=${FILTER(0123456789abcdef,${FAXBOT_COPIER})} dialed=${FILTER(0123456789+,${FAXBOT_DIALED})})})
 same => n,Set(FAXBOT_HANDOVER=${FILTER(abcdefghijklmnopqrstuvwxyz_,${FAXBOT_HANDOVER})})
 same => n,GotoIf($["${FAXBOT_HANDOVER}" = "ok"]?done)
 same => n,Log(ERROR,Copier fax ${FILTER(0123456789.,${UNIQUEID})} was not handed to Faxbot (${FAXBOT_HANDOVER}). It stays in /faxdata/inbound.)
 same => n(done),Return()

; Faxbot sends a received fax on to a copier's extension: Originate PJSIP/copier-<extension> into this context with
; FAXFILE and FAXBOT_JOB. The copier answers as a fax machine; when it doesn't, the fax stays in Faxbot's intake.
[faxbot-copier-send]
exten => s,1,Set(FAXOPT(ecm)=yes)
 same => n,SendFAX(${FAXFILE},f)
 same => n,UserEvent(FaxCopierSent,Job:${FILTER(0123456789abcdef,${FAXBOT_JOB})},Status:${FILTER(ABCDEFGHIJKLMNOPQRSTUVWXYZ_,${FAXSTATUS})},Pages:${FILTER(0123456789,${FAXPAGES})})
 same => n,Hangup()
