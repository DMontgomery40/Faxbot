; Faxbot's fax settings for received calls, and the SSL Fax engine's lines.
; Faxbot writes its own copy with the trunk (Apply on the trunk page); these
; are the recommended values Asterisk uses until then. No lines: the built-in
; engine answers every call.
[faxbot-options]
exten => s,1,Set(FAXBOT_IN_RATE=14400)
 same => n,Set(FAXBOT_IN_AUDIO_RATE=9600)
 same => n,Set(FAXBOT_IN_ECM=yes)
 same => n,Set(FAXBOT_ENGINE_LINES=)
 same => n,Return()
