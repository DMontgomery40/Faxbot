# For fax servers that send their faxes through Faxbot (Delivery setup → Carrier trunk → Fax servers that send
# through Faxbot), such as OpenText RightFax with a Brooktrout SR140 whose Primary Gateway is Faxbot.
# Set FAXBOT_LAN_ADDRESS in .env to this computer's address on your network, then add this file to the ones you
# start Faxbot with, for example:
#
#   docker compose -f docker-compose.yml -f docker-compose.fax-ports.yml -f docker-compose.fax-server.yml up -d
#
# SIP for fax servers (UDP and TCP) is published on that address only, never on every interface, so nothing is
# opened toward the internet, and it never shares the carrier's connection. FAXBOT_FAX_SERVER_PORT is the port
# there (default 5060); use another, such as 5070, when 5060 is already published on that address (for example
# by docker-compose.public.yml). Media uses the range another file already publishes (docker-compose.fax-ports.yml
# or your own); this file publishes none, because Docker cannot publish one port twice.
#
# Faxbot recognises each fax server by its address, so the server's own address must reach Asterisk unchanged:
# Docker Engine on Linux does that; Docker Desktop and Colima replace it, so use a Linux host.
services:
  asterisk:
    environment:
      - FAXBOT_FAX_SERVER_ADDRESS=${FAXBOT_LAN_ADDRESS:?Set FAXBOT_LAN_ADDRESS in .env to this computer's address on your local network}
      - FAXBOT_FAX_SERVER_PORT=${FAXBOT_FAX_SERVER_PORT:-5060}
    ports:
      - "${FAXBOT_LAN_ADDRESS:?Set FAXBOT_LAN_ADDRESS in .env}:${FAXBOT_FAX_SERVER_PORT:-5060}:5080/udp"
      - "${FAXBOT_LAN_ADDRESS:?Set FAXBOT_LAN_ADDRESS in .env}:${FAXBOT_FAX_SERVER_PORT:-5060}:5080/tcp"
  api:
    environment:
      # Only so Faxbot can tell you where to point the fax server.
      - FAXBOT_FAX_SERVER_ADDRESS=${FAXBOT_LAN_ADDRESS:?Set FAXBOT_LAN_ADDRESS in .env}
      - FAXBOT_FAX_SERVER_PORT=${FAXBOT_FAX_SERVER_PORT:-5060}
