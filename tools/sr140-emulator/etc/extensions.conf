; The SR140 stand-in's dialplan. send.sh drops a call file that dials PJSIP/<number>@faxbot-gateway and, once the
; gateway answers, sends the TIFF here with SendFAX (z: ask for T.38 if the gateway has not after about ten seconds,
; as an SR140 configured for T.38 does). Every call leaves one line in /fax/results.log.
[general]
static=yes
writeprotect=yes
autofallthrough=yes

[sr140-send]
exten => s,1,Set(CHANNEL(hangup_handler_push)=sr140-result,s,1)
 same => n,Set(FAXFILE=${IF($["${FAXFILE}" = ""]?/fax/test-fax.tiff:${FAXFILE})})
 same => n,Set(FAXOPT(ecm)=yes)
 same => n,Set(FAXOPT(maxrate)=14400)
 same => n,Set(FAXOPT(headerinfo)=SR140 stand-in)
 same => n,Set(FAXOPT(localstationid)=+15555550100)
 same => n,SendFAX(${FAXFILE},z)
 same => n,Hangup()
; A call the gateway refused, or that never answered (call files run this with REASON set: 1 hung up, 3 no answer,
; 5 busy, 8 congestion or refused).
exten => failed,1,Set(FILE(/fax/results.log,,,al,u)=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)} to=${SR140_TO} result=NOT_ANSWERED reason=${REASON})
 same => n,Hangup()

[sr140-result]
exten => s,1,Set(FILE(/fax/results.log,,,al,u)=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)} to=${SR140_TO} result=${FAXSTATUS} error=${FAXERROR} pages=${FAXPAGES} mode=${FAXMODE} rate=${FAXBITRATE} remote=${REMOTESTATIONID} cause=${HANGUPCAUSE})
 same => n,Return()

; The gateway never calls the stand-in.
[sr140-in]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)
