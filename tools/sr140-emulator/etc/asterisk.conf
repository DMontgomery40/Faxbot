; The SR140 stand-in runs its own Asterisk from Faxbot's image, with only the files in this folder (run.sh copies
; them to /tmp/sr140/etc and fills in pjsip.conf).
[directories]
astetcdir=/tmp/sr140/etc
astmoddir=/usr/lib/asterisk/modules
astvarlibdir=/tmp/sr140/lib
astdbdir=/tmp/sr140/lib
astkeydir=/tmp/sr140/lib
astdatadir=/var/lib/asterisk
astagidir=/var/lib/asterisk/agi-bin
astspooldir=/tmp/sr140/spool
astrundir=/tmp/sr140/run
astlogdir=/tmp/sr140/log

[options]
verbose=3
documentation_language=en_US
