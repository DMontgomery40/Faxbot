name: Docs Autopilot (LLM)

on:
  push:
    branches: [ main, feat/faxbot-refresh ]
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Previous source commit SHA to compare (not the current branch tip)'
        required: true
      provider:
        description: 'Optional LLM proposal provider'
        type: choice
        options: [ openai, anthropic ]
        default: openai
      apply:
        description: 'Open a reviewed instructional-docs PR; never publish directly'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  propose-docs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate instructional update plan from actual previous source SHA
        env:
          DOCS_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$DOCS_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$DOCS_BASE_SHA^{commit}" || git fetch --no-tags origin "$DOCS_BASE_SHA"
          fi
          python scripts/docs_ai/generate_docs_from_diff.py
      - uses: actions/upload-artifact@v4
        with:
          name: docs-autopilot-plan-${{ github.sha }}
          path: mkdocs-docs-plan.md
          if-no-files-found: error
  apply-llm:
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r api/requirements.txt requests
          python scripts/docs_ai/generate_reference.py
      - name: Produce optional instructional proposal
        env:
          BASE_REF: ${{ inputs.base_ref }}
          PROVIDER: ${{ inputs.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/docs_ai/generate_docs_from_diff.py --base "$BASE_REF" --llm "$PROVIDER"
          python scripts/docs_ai/validate_doc_patch.py mkdocs-docs-llm.patch
          git apply --index mkdocs-docs-llm.patch
      - name: Create reviewed proposal against main
        uses: peter-evans/create-pull-request@v6
        with:
          branch: docs/ai-update-${{ github.run_id }}
          base: main
          add-paths: docs/**
          commit-message: 'docs: propose instructional updates @codex review'
          title: 'docs: proposed instructional updates'
          body: 'Optional Docs Autopilot proposal. Generated source references remain deterministic; review this prose before merging.'
