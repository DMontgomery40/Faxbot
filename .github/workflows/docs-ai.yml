name: Docs Autopilot (LLM)

on:
  push:
    branches: [ main, feat/faxbot-refresh ]
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Previous source commit SHA to compare (not the current branch tip)'
        required: true
      model:
        description: 'OpenRouter model that writes the proposal'
        type: choice
        options: [ openai/gpt-6-luna, anthropic/claude-sonnet-5.5 ]
        default: openai/gpt-6-luna
      apply:
        description: 'Open a reviewed instructional-docs PR; never publish directly'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  propose-docs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate instructional update plan from actual previous source SHA
        env:
          DOCS_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$DOCS_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$DOCS_BASE_SHA^{commit}" || git fetch --no-tags origin "$DOCS_BASE_SHA"
          fi
          python scripts/docs_ai/generate_docs_from_diff.py
      - uses: actions/upload-artifact@v4
        with:
          name: docs-autopilot-plan-${{ github.sha }}
          path: mkdocs-docs-plan.md
          if-no-files-found: error
  # Manual only. The job holding the OpenRouter key can read the repository but not write to it.
  propose-llm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r api/requirements.txt
          python scripts/docs_ai/generate_reference.py
      - name: Produce and validate an instructional proposal
        env:
          BASE_REF: ${{ inputs.base_ref }}
          DOCS_AI_MODEL: ${{ inputs.model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/docs_ai/generate_docs_from_diff.py --base "$BASE_REF" --llm openrouter
          python scripts/docs_ai/validate_doc_patch.py mkdocs-docs-llm.patch
      - uses: actions/upload-artifact@v4
        with:
          name: docs-autopilot-proposal-${{ github.run_id }}
          path: mkdocs-docs-llm.patch
          if-no-files-found: error
  open-proposal:
    needs: propose-llm
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: docs-autopilot-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal
      - name: Validate again and stage the proposal
        run: |
          python scripts/docs_ai/validate_doc_patch.py "$RUNNER_TEMP/proposal/mkdocs-docs-llm.patch"
          git apply --index "$RUNNER_TEMP/proposal/mkdocs-docs-llm.patch"
          python scripts/docs_ai/validate_doc_patch.py --staged
      - name: Create reviewed proposal against main
        uses: peter-evans/create-pull-request@v6
        with:
          branch: docs/ai-update-${{ github.run_id }}
          # The branch the proposal ran on (main, or an integration branch such as feat/enterprise).
          base: ${{ github.ref_name }}
          add-paths: docs/**
          commit-message: 'docs: propose instructional updates @codex review'
          title: 'docs: proposed instructional updates'
          body: 'Optional Docs Autopilot proposal. Generated source references remain deterministic; review this prose before merging.'
