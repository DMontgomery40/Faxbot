name: Generate API and Documentation Preview

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_ref:
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: docs-${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source and documentation dependencies
        run: |
          python -m pip install -r api/requirements.txt -r docs/requirements.txt
          python -m pip check
          npm ci --prefix scripts/docs_ai --no-audit --no-fund
      - name: Test documentation generation and publication boundaries
        run: PYTHONPATH=. python -m pytest scripts/docs_ai/tests -q
      - name: Generate references from the exact checked-out source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python scripts/docs_ai/generate_reference.py --source-sha "$SOURCE_SHA" --source-ref "$SOURCE_REF" --require-clean
      - name: Build Redocly API reference and strict MkDocs site
        env:
          MIKE_DOCS_VERSION: ${{ inputs.source_sha }}
        run: |
          python scripts/docs_ai/build_api.py
          mkdocs build --strict --site-dir site
      - name: Upload preview and source reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ inputs.source_sha }}
          path: |
            site/
            docs/generated/
          if-no-files-found: error
          retention-days: 14
