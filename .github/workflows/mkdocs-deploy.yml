name: Build and Deploy MkDocs (mike)

on:
  push:
    branches: [ main, feat/faxbot-refresh ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      latest:
        description: 'Also make this version the default ("latest") on docs.faxbot.net'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview:
    uses: ./.github/workflows/api-docs.yml
    with:
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.head_ref || github.ref_name }}
  publish:
    needs: preview
    # Pushes to main publish and become latest; a person can also publish any branch by hand.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      # Keep every source version eligible; a shared group drops pending runs.
      group: faxbot-docs-publication-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned publication toolchain
        run: python -m pip install -r docs/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preview.outputs.artifact_name }}
          path: ${{ runner.temp }}/docs-artifact
      - name: Restore generated reference overlay from verified artifact
        run: cp -R "$RUNNER_TEMP/docs-artifact/docs/generated" docs/generated
      - name: Publish exact source version without replacing newer latest or site history
        env:
          SOURCE_SHA: ${{ github.sha }}
          FAXBOT_DOCS_BUILT_SITE: ${{ runner.temp }}/docs-artifact/site
          PUBLISH_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.latest }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -c 'import json,os; from pathlib import Path; data=json.loads(Path("docs/generated/provenance.json").read_text()); assert data["source_sha"] == os.environ["SOURCE_SHA"] and not data["source_tree_dirty"]'
          git config user.name "Faxbot documentation bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A non-fast-forward rejection retries from the newly published head.
          # This is the cross-run compare-and-swap, without a force push.
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin gh-pages
            git branch --force gh-pages origin/gh-pages
            MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$MAIN_SHA" = "$SOURCE_SHA" ] || [ "$PUBLISH_LATEST" = "true" ]; then
              # An early deploy published a version literally named "latest", which
              # stops "latest" from becoming an alias. Remove only that version, in a
              # new gh-pages commit, so earlier history stays in Git.
              if git show gh-pages:versions.json | python -c 'import json,sys; sys.exit(0 if any(v["version"] == "latest" for v in json.load(sys.stdin)) else 1)'; then
                mike delete --branch gh-pages latest
              fi
              # Redirect aliases: GitHub Pages does not serve symlinked folders reliably.
              mike deploy --branch gh-pages --update-aliases --alias-type=redirect "$SOURCE_SHA" latest
              mike set-default --branch gh-pages latest
            else
              mike deploy --branch gh-pages "$SOURCE_SHA"
            fi
            git diff --exit-code origin/gh-pages gh-pages -- CNAME
            if git push origin gh-pages; then
              exit 0
            fi
            sleep "$ATTEMPT"
          done
          echo "Documentation publication could not reconcile concurrent updates." >&2
          exit 1
      - name: Request build of the existing GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
