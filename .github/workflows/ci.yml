name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: faxbot_test
          POSTGRES_PASSWORD: faxbot_ci_synthetic
          POSTGRES_DB: faxbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faxbot_test -d faxbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
      - name: Install Python deps
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ../python_mcp/requirements.txt
          python -m pip check
      - name: Run tests
        env:
          FAX_DISABLED: 'true'
          FAX_DATA_DIR: './faxdata'
          DATABASE_URL: 'sqlite:///./test_faxbot_ci.db'
          FAXBOT_SCHEMA_TEST_POSTGRES_URL: 'postgresql+psycopg2://faxbot_test:faxbot_ci_synthetic@127.0.0.1:5432/faxbot_test'
        working-directory: api
        run: |
          mkdir -p faxdata
          pytest -q
