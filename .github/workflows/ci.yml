name: CI

# Enterprise checks use synthetic data, mocks and local services only.
# Never require live enterprise E2E, customer credentials or customer access here.
# Missing external validation is not a merge/release gate; see CONTRIBUTING.md.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

# A newer push to the same branch or pull request replaces the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: faxbot_test
          POSTGRES_PASSWORD: faxbot_ci_synthetic
          POSTGRES_DB: faxbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faxbot_test -d faxbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
      - name: Install Python deps
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r ../python_mcp/requirements.txt
          # The API suite drives the Python SDK end to end, so install it with its dependencies.
          pip install -e ../sdks/python
          python -m pip check
      - name: Run tests
        env:
          FAX_DISABLED: 'true'
          FAX_DATA_DIR: './faxdata'
          DATABASE_URL: 'sqlite:///./test_faxbot_ci.db'
          FAXBOT_SCHEMA_TEST_POSTGRES_URL: 'postgresql+psycopg2://faxbot_test:faxbot_ci_synthetic@127.0.0.1:5432/faxbot_test'
        working-directory: api
        run: |
          mkdir -p faxdata
          pytest -q

  build-admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: api/admin_ui/package-lock.json
      - name: Install Admin UI dependencies
        working-directory: api/admin_ui
        run: npm ci
      - name: Admin UI tests
        working-directory: api/admin_ui
        run: npx vitest run
      - name: Typecheck and build Admin UI
        working-directory: api/admin_ui
        run: npm run build

  check-node-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: node_mcp/package-lock.json
      - name: Install Node MCP dependencies
        run: npm ci --prefix node_mcp --no-audit --no-fund
      - name: Check Node MCP sources parse and import
        run: npm --prefix node_mcp run check

  check-python-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python MCP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_mcp/requirements.txt pytest==8.3.2 pytest-asyncio==0.23.8 cryptography==50.0.2
          python -m pip check
      - name: Test Python MCP servers
        run: python -m pytest -q python_mcp/tests

  test-node-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: node_mcp/package-lock.json
      - name: Install Node MCP dependencies
        run: npm ci --prefix node_mcp --no-audit --no-fund
      - name: Test Node MCP servers
        run: npm --prefix node_mcp test

  check-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Test Python SDK
        run: |
          python -m pip install --upgrade pip
          pip install ./sdks/python pytest==8.3.2
          python -m pytest -q sdks/python/tests
      - name: Test Node SDK
        run: |
          npm install --prefix sdks/node --no-audit --no-fund --no-package-lock
          npm --prefix sdks/node test
