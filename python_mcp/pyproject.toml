[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faxbot-mcp"
version = "3.0.0"
description = "Faxbot MCP servers (Python): stdio, HTTP, SSE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - written permission required; see LICENSE" }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
authors = [
  { name = "David Montgomery", email = "dmontg@gmail.com" }
]
keywords = ["mcp", "fax", "faxbot", "sse", "streamable-http"]
dependencies = [
  "mcp==2.3.0",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "python-jose==3.5.0",
  "httpx==0.28.1",
  "anyio==4.15.1",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
]

[project.urls]
Homepage = "https://github.com/DMontgomery40/Faxbot"
Issues = "https://github.com/DMontgomery40/Faxbot/issues"

[project.scripts]
faxbot-mcp-py-stdio = "stdio_server:main"
faxbot-mcp-py-http = "http_server:main"
faxbot-mcp-py-sse = "server:main"

[tool.setuptools]
py-modules = ["server", "http_server", "stdio_server", "faxbot_tools", "transport_config"]
