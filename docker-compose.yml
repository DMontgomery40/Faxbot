# Every service keeps at most three 10 MB log files, so logs never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    logging: *logging
    build:
      context: .
      dockerfile: ./api/Dockerfile
    # Start again after any exit, including Restart API in the console (it exits
    # with code 0), until someone stops the service on purpose.
    restart: unless-stopped
    # Settings for a new installation's first start. Optional: without it Faxbot starts with defaults.
    env_file:
      - path: ./.env
        required: false
    environment:
      - FAX_DATA_DIR=/faxdata
      - ENABLE_LOCAL_ADMIN=true
      - ADMIN_ALLOW_RESTART=true
      # Persist DB to volume so jobs/keys/inbox survive rebuilds
      - DATABASE_URL=sqlite:////faxdata/faxbot.db
    volumes:
      - faxdata:/faxdata
      # The SSL Fax engine's settings (Faxbot writes them) and what the engine
      # hands back (its status and received faxes; Faxbot only reads them).
      - hylafax-settings:/faxdata/hylafax
      - hylafax-out:/faxdata/hylafax-out:ro
    ports:
      - "8080:8080"
    # A fixed address on Faxbot's network: Asterisk's manager port accepts only this address,
    # so no other container (the SSL Fax engine reads data from other machines) can reach it.
    networks:
      default:
        ipv4_address: ${FAXBOT_API_ADDRESS:-172.30.53.10}
    # Note: Asterisk dependency is optional - only needed for SIP backend

  # Asterisk service - only needed for SIP backend
  # Can be disabled by setting FAX_BACKEND=phaxio in .env (cloud backend)
  asterisk:
    logging: *logging
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only what Asterisk reads (start.sh, bin/faxbot-inbound-notify and the dialplan's ENV()),
    # never the whole .env: the provider, mail and carrier keys stay with the API. Each is
    # empty when .env does not set it. test_sip_compose.py lists what each service may get.
    environment:
      - TZ=${TZ:-UTC}
      - SIP_USERNAME=${SIP_USERNAME:-}
      - SIP_PASSWORD=${SIP_PASSWORD:-}
      - SIP_SERVER=${SIP_SERVER:-}
      - SIP_FROM_DOMAIN=${SIP_FROM_DOMAIN:-}
      - SIP_REGISTER=${SIP_REGISTER:-}
      - ASTERISK_AMI_USERNAME=${ASTERISK_AMI_USERNAME:-}
      - ASTERISK_AMI_PASSWORD=${ASTERISK_AMI_PASSWORD:-}
      - ASTERISK_INBOUND_SECRET=${ASTERISK_INBOUND_SECRET:-}
      - FAX_HEADER=${FAX_HEADER:-}
      - FAX_LOCAL_STATION_ID=${FAX_LOCAL_STATION_ID:-}
      - FAXBOT_LOCAL_NET=${FAXBOT_LOCAL_NET:-}
      # The one address the manager port accepts (the API's, above).
      - FAXBOT_API_ADDRESS=${FAXBOT_API_ADDRESS:-172.30.53.10}
    volumes:
      - faxdata:/faxdata
      # Asterisk tells the SSL Fax engine which fax lines it loaded.
      - hylafax-settings:/faxdata/hylafax
    # No published ports. Asterisk registers with the carrier and starts every
    # call's audio and fax data from inside, so the carrier answers on those
    # flows and nothing has to reach in. (Publishing the old 1000-port media
    # range started one docker-proxy process per port and exhausted small hosts.)
    # A carrier that signs in by IP address needs a public host: add
    # -f docker-compose.public.yml, see docs/setup/sip-trunk.md.
    # The manager port (5038) stays private on the compose network.

  # Faxbot's SSL Fax engine (HylaFAX+ 7.0.11): places and answers trunk faxes
  # through Asterisk's IAX lines and sends pages over SSL Fax when the other
  # fax machine supports it. It waits until Faxbot writes its settings (Apply on
  # the trunk page); while it is not running Faxbot uses its built-in engine.
  # No published ports: job submission (4559) and the fax lines (4569 on
  # Asterisk) stay on the compose network. See docs/setup/sslfax.md.
  # The engine reads fax and TLS data from other machines, so it never gets
  # Faxbot's data folder: its settings read-only, one folder it hands faxes
  # and its status back in, and its own volume.
  hylafax:
    logging: *logging
    build:
      context: ./hylafax
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - hylafax-settings:/faxdata/hylafax:ro
      - hylafax-out:/faxdata/hylafax-out
      - hylafax:/var/lib/faxbot-engine

  # Optional: Faxbot MCP Server for AI integration
  # Each MCP client sends its own Faxbot API key with every request, so the MCP
  # services get no Faxbot key. Values come from .env next to this file when set.
  faxbot-mcp:
    logging: *logging
    build:
      context: ./node_mcp
      dockerfile: Dockerfile
    environment:
      - FAX_API_URL=http://api:8080
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-}
      - OAUTH_AUDIENCE=${OAUTH_AUDIENCE:-}
      - OAUTH_JWKS_URL=${OAUTH_JWKS_URL:-}
      - MCP_OAUTH_SUBJECT_KEYS_FILE=${MCP_OAUTH_SUBJECT_KEYS_FILE:-}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-}
    depends_on:
      - api
    ports:
      - "3001:3001"
    profiles:
      - mcp
    stdin_open: true
    tty: true

  # Python MCP over SSE, only for older clients that cannot use Streamable HTTP.
  # Removed in the next release; use faxbot-mcp (Streamable HTTP).
  faxbot-mcp-py-sse:
    logging: *logging
    build:
      context: ./python_mcp
      dockerfile: Dockerfile.sse
    environment:
      - FAX_API_URL=http://api:8080
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-}
      - OAUTH_AUDIENCE=${OAUTH_AUDIENCE:-}
      - OAUTH_JWKS_URL=${OAUTH_JWKS_URL:-}
      - MCP_OAUTH_SUBJECT_KEYS_FILE=${MCP_OAUTH_SUBJECT_KEYS_FILE:-}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-}
    depends_on:
      - api
    ports:
      - "3003:3003"
    profiles:
      - mcp
    stdin_open: true
    tty: true


# Faxbot's own network, with a fixed range so the API's address above stays the same
# when its container is recreated. Change FAXBOT_NETWORK (and FAXBOT_API_ADDRESS inside
# it) in .env if this range is already used on the computer.
networks:
  default:
    ipam:
      config:
        - subnet: ${FAXBOT_NETWORK:-172.30.53.0/24}

volumes:
  faxdata:
    driver: local
  # The SSL Fax engine's own volume: its certificate and key (made once at its
  # first start), received faxes and reports waiting for Faxbot.
  hylafax:
    driver: local
  # The SSL Fax engine's settings, written by Faxbot and Asterisk (read-only for the engine).
  hylafax-settings:
    driver: local
  # What the SSL Fax engine hands back: its status and received faxes (read-only for Faxbot).
  hylafax-out:
    driver: local
