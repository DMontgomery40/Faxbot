; Faxbot SIP trunk for AnveoDirect, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk
keep_alive_interval=30

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[trunk-aor]
type=aor
contact=sip:sbc.anveo.com:5060
qualify_frequency=25
qualify_timeout=3.0

[trunk-endpoint]
type=endpoint
transport=transport-udp
aors=trunk-aor
context=faxbot-inbound
disallow=all
allow=ulaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
rtp_keepalive=2
send_pai=yes
from_domain=sbc.anveo.com

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=169.48.232.158
match=204.216.109.55
match=176.9.39.206
match=72.9.149.25
