; Faxbot SIP trunk for Telnyx, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=203.0.113.10
external_signaling_address=203.0.113.10
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=127.0.0.0/8

[trunk-aor]
type=aor
contact=sip:sip.telnyx.com:5060
qualify_frequency=60

[trunk-auth]
type=auth
auth_type=userpass
username=faxbotuser
password=synthetic-Trunk-Pass!42

[trunk-endpoint]
type=endpoint
transport=transport-udp
aors=trunk-aor
outbound_auth=trunk-auth
context=faxbot-inbound
disallow=all
allow=ulaw,alaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
send_pai=yes
from_domain=sip.telnyx.com

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=192.76.120.10
match=64.16.250.10

[trunk-registration]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:sip.telnyx.com:5060
client_uri=sip:faxbotuser@sip.telnyx.com:5060
contact_user=faxbotuser
retry_interval=60
forbidden_retry_interval=600
expiration=300
line=yes
endpoint=trunk-endpoint
