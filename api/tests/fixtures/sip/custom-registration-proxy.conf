; Faxbot SIP trunk for Another carrier, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[trunk-aor]
type=aor
contact=sip:sip.example.net:5080\;transport=tcp
qualify_frequency=60

[trunk-auth]
type=auth
auth_type=userpass
username=faxbot
password=synthetic-Trunk-Pass!42

[trunk-endpoint]
type=endpoint
transport=transport-tcp
aors=trunk-aor
outbound_auth=trunk-auth
context=faxbot-inbound
disallow=all
allow=alaw,ulaw
t38_udptl=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
send_pai=yes
from_domain=sip.example.net
outbound_proxy=sip:proxy.example.net:5070\;lr

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=sip.example.net

[trunk-registration]
type=registration
transport=transport-tcp
outbound_auth=trunk-auth
server_uri=sip:sip.example.net:5080\;transport=tcp
client_uri=sip:faxbot@sip.example.net:5080\;transport=tcp
contact_user=faxbot
retry_interval=60
forbidden_retry_interval=600
expiration=300
line=yes
endpoint=trunk-endpoint
outbound_proxy=sip:proxy.example.net:5070\;lr
