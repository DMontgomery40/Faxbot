; Faxbot SIP trunk for Telnyx, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk
keep_alive_interval=30

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@FAXBOT_PUBLIC_ADDRESS@
external_signaling_address=@FAXBOT_PUBLIC_ADDRESS@
local_net=@FAXBOT_LOCAL_NET@

[trunk-aor]
type=aor
contact=sip:sip.telnyx.com:5060
qualify_frequency=25
qualify_timeout=3.0

[trunk-auth]
type=auth
auth_type=userpass
username=faxbotuser
password=synthetic-Trunk-Pass!42

[trunk-endpoint]
type=endpoint
transport=transport-udp
aors=trunk-aor
outbound_auth=trunk-auth
context=faxbot-inbound
disallow=all
allow=ulaw,alaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
rtp_keepalive=2
send_pai=yes
from_domain=sip.telnyx.com

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=192.76.120.10
match=64.16.250.10

[trunk-registration]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:sip.telnyx.com:5060
client_uri=sip:faxbotuser@sip.telnyx.com:5060
contact_user=faxbotuser
expiration=120
retry_interval=60
forbidden_retry_interval=600
fatal_retry_interval=120
max_retries=10000
auth_rejection_permanent=no
line=yes
endpoint=trunk-endpoint
