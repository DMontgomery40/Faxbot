; Faxbot SIP trunk for BT One Voice, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk
keep_alive_interval=30

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@FAXBOT_PUBLIC_ADDRESS@
external_signaling_address=@FAXBOT_PUBLIC_ADDRESS@
local_net=@FAXBOT_LOCAL_NET@

[trunk-aor]
type=aor
contact=sip:192.0.2.50:5060
qualify_frequency=25
qualify_timeout=3.0

[trunk-endpoint]
type=endpoint
transport=transport-udp
aors=trunk-aor
context=faxbot-inbound
disallow=all
allow=alaw,ulaw
t38_udptl=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
rtp_keepalive=2
send_pai=yes
from_domain=192.0.2.50

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=192.0.2.50
