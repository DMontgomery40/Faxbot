; Faxbot SIP trunk for Flowroute, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[trunk-aor]
type=aor
contact=sip:us-east-va.sip.flowroute.com:5060
qualify_frequency=60

[trunk-endpoint]
type=endpoint
transport=transport-udp
aors=trunk-aor
context=faxbot-inbound
disallow=all
allow=ulaw,alaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
send_pai=yes
from_domain=us-east-va.sip.flowroute.com

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=34.210.91.112/28
match=34.226.36.32/28
