; Faxbot SIP trunk for Telstra SIP Connect, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk
keep_alive_interval=30

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
tcp_keepalive_enable=yes
tcp_keepalive_idle_time=30
tcp_keepalive_interval_time=10
tcp_keepalive_probe_count=3
external_media_address=@FAXBOT_PUBLIC_ADDRESS@
external_signaling_address=@FAXBOT_PUBLIC_ADDRESS@
local_net=@FAXBOT_LOCAL_NET@

[trunk-aor]
type=aor
contact=sip:sipconnect.example.net:5060\;transport=tcp
qualify_frequency=30
qualify_timeout=3.0

[trunk-auth]
type=auth
auth_type=userpass
username=faxbot
password=synthetic-Trunk-Pass!42

[trunk-endpoint]
type=endpoint
transport=transport-tcp
aors=trunk-aor
outbound_auth=trunk-auth
context=faxbot-inbound
disallow=all
allow=alaw,ulaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
rtp_keepalive=2
send_pai=yes
from_domain=sipconnect.example.net
outbound_proxy=sip:sbc.example.net:5060\;lr

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=sipconnect.example.net

[trunk-registration]
type=registration
transport=transport-tcp
outbound_auth=trunk-auth
server_uri=sip:sipconnect.example.net:5060\;transport=tcp
client_uri=sip:faxbot@sipconnect.example.net:5060\;transport=tcp
contact_user=faxbot
expiration=300
retry_interval=60
forbidden_retry_interval=600
fatal_retry_interval=120
max_retries=10000
auth_rejection_permanent=no
line=yes
endpoint=trunk-endpoint
outbound_proxy=sip:sbc.example.net:5060\;lr
