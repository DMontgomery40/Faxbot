; Faxbot SIP trunk for Telnyx, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk
keep_alive_interval=30

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2
ca_list_file=/etc/ssl/certs/ca-certificates.crt
verify_server=yes
tcp_keepalive_enable=yes
tcp_keepalive_idle_time=30
tcp_keepalive_interval_time=10
tcp_keepalive_probe_count=3

[trunk-aor]
type=aor
contact=sip:sip.telnyx.com:5061\;transport=tls
qualify_frequency=30
qualify_timeout=3.0

[trunk-endpoint]
type=endpoint
transport=transport-tls
aors=trunk-aor
context=faxbot-inbound
disallow=all
allow=ulaw,alaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
rtp_keepalive=2
send_pai=yes
from_domain=sip.telnyx.com

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=192.76.120.10
match=64.16.250.10
