; Faxbot SIP trunk for Microsoft Teams SBC: AudioCodes Mediant, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk
keep_alive_interval=30

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@FAXBOT_LAN_ADDRESS@
external_signaling_address=@FAXBOT_LAN_ADDRESS@

[trunk-aor]
type=aor
contact=sip:10.30.0.5:5060
qualify_frequency=25
qualify_timeout=3.0

[trunk-endpoint]
type=endpoint
transport=transport-udp
aors=trunk-aor
context=faxbot-inbound
disallow=all
allow=ulaw,alaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
rtp_keepalive=2
send_pai=yes
from_domain=10.30.0.5

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=10.30.0.5
