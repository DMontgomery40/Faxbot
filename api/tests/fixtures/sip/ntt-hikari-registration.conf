; Faxbot SIP trunk for NTT Hikari Denwa, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk
keep_alive_interval=30

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@FAXBOT_PUBLIC_ADDRESS@
external_signaling_address=@FAXBOT_PUBLIC_ADDRESS@
local_net=@FAXBOT_LOCAL_NET@

[trunk-aor]
type=aor
contact=sip:192.0.2.60:5060
qualify_frequency=25
qualify_timeout=3.0

[trunk-auth]
type=auth
auth_type=userpass
username=0312345678
password=synthetic-Trunk-Pass!42

[trunk-endpoint]
type=endpoint
transport=transport-udp
aors=trunk-aor
outbound_auth=trunk-auth
context=faxbot-inbound
disallow=all
allow=ulaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
rtp_keepalive=2
send_pai=yes
from_domain=192.0.2.60

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=192.0.2.60

[trunk-registration]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:192.0.2.60:5060
client_uri=sip:0312345678@192.0.2.60:5060
contact_user=0312345678
expiration=120
retry_interval=60
forbidden_retry_interval=600
fatal_retry_interval=120
max_retries=10000
auth_rejection_permanent=no
line=yes
endpoint=trunk-endpoint
