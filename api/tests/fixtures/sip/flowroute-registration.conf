; Faxbot SIP trunk for Flowroute, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[trunk-aor]
type=aor
contact=sip:us-west-or.sip.flowroute.com:5060
qualify_frequency=60

[trunk-auth]
type=auth
auth_type=userpass
username=12345678
password=synthetic-Trunk-Pass!42

[trunk-endpoint]
type=endpoint
transport=transport-udp
aors=trunk-aor
outbound_auth=trunk-auth
context=faxbot-inbound
disallow=all
allow=ulaw,alaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
send_pai=yes
from_domain=us-west-or.sip.flowroute.com

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=34.210.91.112/28
match=34.226.36.32/28

[trunk-registration]
type=registration
transport=transport-udp
outbound_auth=trunk-auth
server_uri=sip:us-west-or.sip.flowroute.com:5060
client_uri=sip:12345678@us-west-or.sip.flowroute.com:5060
contact_user=12345678
retry_interval=60
forbidden_retry_interval=600
expiration=300
line=yes
endpoint=trunk-endpoint
