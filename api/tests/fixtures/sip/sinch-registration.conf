; Faxbot SIP trunk for Sinch, written by Faxbot from its settings.
; Change the trunk in Faxbot settings; edits to this file are replaced.
[global]
type=global
user_agent=Faxbot-Asterisk

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2
ca_list_file=/etc/ssl/certs/ca-certificates.crt
verify_server=yes

[trunk-aor]
type=aor
contact=sip:example.pstn.sinch.com:5061\;transport=tls
qualify_frequency=60

[trunk-auth]
type=auth
auth_type=userpass
username=faxbot
password=synthetic-Trunk-Pass!42

[trunk-endpoint]
type=endpoint
transport=transport-tls
aors=trunk-aor
outbound_auth=trunk-auth
context=faxbot-inbound
disallow=all
allow=ulaw,alaw
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
t38_udptl_nat=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
send_pai=yes
from_domain=example.pstn.sinch.com

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=example.pstn.sinch.com

[trunk-registration]
type=registration
transport=transport-tls
outbound_auth=trunk-auth
server_uri=sip:example.pstn.sinch.com:5061\;transport=tls
client_uri=sip:faxbot@example.pstn.sinch.com:5061\;transport=tls
contact_user=faxbot
retry_interval=60
forbidden_retry_interval=600
expiration=300
line=yes
endpoint=trunk-endpoint
